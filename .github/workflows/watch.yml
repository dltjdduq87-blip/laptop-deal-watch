name: Laptop public-price watch
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['watch.py', 'config.json', 'core.py', 'test_watch.py', 'catalog.py', 'elevenst.py', 'test_catalog.py', 'offers.py', 'test_offers.py', 'sweep.py', 'test_sweep.py', 'ai_game.py', 'events.py', 'test_ai_events.py', 'as_service.py', 'test_as_service.py', 'loop_watch.sh', 'hotdeal.py', 'test_hotdeal.py', 'release.py', 'test_release.py', 'requirements.txt', '.github/workflows/watch.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: laptop-public-price-watch
  # 코드 push 시에만 기존 반복 실행을 교체; 예약·자기예약 실행은 대기열로
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install public catalog parser
        run: if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
      - name: Regression checks
        run: python3 -m unittest discover -v
      - name: Restore durable checkpoint
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin watch-state > /dev/null; then
            git fetch --depth=1 origin watch-state
            git show FETCH_HEAD:state.json > state.json
          fi
      - name: Collect public prices and notify verified recipient
        id: collect
        continue-on-error: true
        env:
          ELEVENST_API_KEY: ${{ secrets.ELEVENST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOP_MINUTES: '340'
        run: bash loop_watch.sh
      - name: Mark loop with every collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
